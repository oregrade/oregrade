  outcome_resolved: true
  outcome: cache surface, heavy hyperscaler resale, 2024 relicense, Valkey fork
  company: Redis Ltd
  note: "Third instance. Three cases means the pattern is testable rather than anecdotal. Also a maintainer_profile\
