# oregrade — resolved labels. NOTHING UNDER src/ MAY READ THIS FILE.
# All 42 benchmark entries, including unresolved and never-fund-mode ones.
method:
  scoring_rule: 'CRITICAL: score each project at its snapshot_year, NOT at today''s state. Scoring Grafana
    in 2026 is worthless; the rubric has to have picked Grafana in 2014. Any signal that cannot be reconstructed
    point-in-time is excluded from the backtest, even if it ships in the live tool.

    '
  reconstructable:
  - commit and PR history (full, from git)
  - contributor concentration at date (from git)
  - license at date (from git)
  - repo events from 2011 onward (GHArchive)
  not_reconstructable:
  - dependent counts at date
  - download trends at date
  - stars at date (GHArchive partial, expensive)
  blind_protocol: 'Score all 30 before looking at any label. Record scores in benchmarks/run-001.json.
    Only then compare. Every later tuning pass gets its own run file and a one-line note on what changed
    and why.

    '
labels:
  commercialized_success: project became a substantial standalone company
  commercialized_modest: company formed, outcome small or acqui-hire
  commercialized_failed: serious attempt, did not work
  never_commercialized: large project, no company ever formed
  adversarial: "the rubric is expected to get this wrong \u2014 that's the point"
open_issues:
- id: point_in_time_data
  severity: blocking
  detail: "GHArchive (BigQuery, events from 2011) is the only practical source for historical GitHub state.\
    \ Reconstruct what you can from git directly \u2014 commit and PR history, contributor concentration,\
    \ license \u2014 and exclude the rest from the backtest rather than back-filling with today's values.\
    \ Silently using present-day dependents on a 2014 snapshot invalidates the entire run.\n"
- id: survivorship
  severity: known
  detail: "Projects that died before commercialization are systematically missing \u2014 no company, no\
    \ press, no memory. The never_commercialized set here is all large and living. Consider mining GitHub's\
    \ archived-repo population from 2014-2016 for genuinely dead candidates.\n"
- id: sample_size
  severity: known
  detail: 'n=30 supports a directional claim, not a p-value. Say "the rubric separates these 30" and nothing
    stronger. Resist the significance test.

    '
fund_mode_note: In fund mode the never_commercialized group (requests, curl, lodash, brew, neovim, obs,
  webpack, audacity, prometheus) fails gate 4 for absence of an entity and never reaches scoring. The
  fund-mode contrast is therefore success vs modest/failed among companies that DID exist. v1 had only
  four negatives and all were famous; the eight additions above target that survivorship gap, Riak especially.
labelling_rule: "A label counts only if the outcome RESOLVED \u2014 IPO, acquisition, shutdown, or sustained\
  \ disclosed scale \u2014 and the fund_snapshot is at least five years old. The v1 set failed this: successes\
  \ had median fund_snapshot 2021 against 2014 for failures, so vintage separated the classes almost perfectly\
  \ and any model would have learned 'later is better'. The 2021 cohort was labelled success on funding\
  \ and momentum, which is precisely the evidence RethinkDB had in 2014. Those entries are now 'unresolved'\
  \ and excluded from scoring runs; their prior labels are retained in label_provisional for a re-run\
  \ in 2027."
