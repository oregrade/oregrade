  outcome_resolved: true
  outcome: 'large company, then AWS launched a competing managed service, then the 2021 SSPL relicense,
    then the OpenSearch fork, then a partial return to AGPL

    '
  company: Elastic
  note: 'THE substitution_risk case. Permissive license plus a database surface plus a hyperscaler equals
    capture. Should score high on adoption and badly on substitution_risk at the 2014 snapshot. If it
    doesn''t, the dimension is inert.

    '
- repo: mongodb/mongo
  label: commercialized_success
  resolution: IPO 2017
  outcome_resolved: true
  company: MongoDB
  note: "Same pressure as Elastic, survived it, wrote SSPL in response. Tests whether substitution_risk\
