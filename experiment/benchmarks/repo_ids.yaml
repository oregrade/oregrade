# Stable numeric GitHub repo ids for the corpus.
#
# GHArchive records repo.name as of the event, so filtering history by a
# project's CURRENT name misses everything recorded under a former one.
# repo.id is permanent. Queries filter on it; see src/gharchive.py.
#
# current_full_name is recorded for audit only. It detects a rename that
# happened AFTER today's name was adopted (docker/docker -> moby/moby) but
# NOT one that happened before (elasticsearch/elasticsearch ->
# elastic/elasticsearch, where today's name is already the new one). Only
# the id is invariant, which is the whole reason it is used.
