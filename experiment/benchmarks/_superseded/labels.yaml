open_issues:
- id: point_in_time_data
  severity: blocking
  detail: 'GHArchive (BigQuery, events from 2011) is the only practical source for historical GitHub state.
    Reconstruct what you can from git directly — commit and PR history, contributor concentration, license
    — and exclude the rest from the backtest rather than back-filling with today''s values. Silently using
    present-day dependents on a 2014 snapshot invalidates the entire run.

    '
- id: survivorship
  severity: known
  detail: 'Projects that died before commercialization are systematically missing — no company, no press,
    no memory. The never_commercialized set here is all large and living. Consider mining GitHub''s archived-repo
    population from 2014-2016 for genuinely dead candidates.

    '
- id: sample_size
  severity: known
  detail: 'n=30 supports a directional claim, not a p-value. Say "the rubric separates these 30" and nothing
    stronger. Resist the significance test.

    '
fund_mode_note: In fund mode the never_commercialized group (requests, curl, lodash, brew, neovim, obs,
  webpack, audacity, prometheus) fails gate 4 for absence of an entity and never reaches scoring. The
  fund-mode contrast is therefore success vs modest/failed among companies that DID exist. v1 had only
  four negatives and all were famous; the eight additions above target that survivorship gap, Riak especially.
labelling_rule: 'A label counts only if the outcome RESOLVED — IPO, acquisition, shutdown, or sustained
  disclosed scale — and the fund_snapshot is at least five years old. The v1 set failed this: successes
  had median fund_snapshot 2021 against 2014 for failures, so vintage separated the classes almost perfectly
  and any model would have learned ''later is better''. The 2021 cohort was labelled success on funding
  and momentum, which is precisely the evidence RethinkDB had in 2014. Those entries are now ''unresolved''
  and excluded from scoring runs; their prior labels are retained in label_provisional for a re-run in
  2027.'
