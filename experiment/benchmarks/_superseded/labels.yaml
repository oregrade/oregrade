« benchmarks/labels.yaml »
method:
  scoring_rule: 'CRITICAL: score each project at its snapshot_year, NOT at today''s state. Scoring Grafana
    in 2026 is worthless; the rubric has to have picked Grafana in 2014. Any signal that cannot be reconstructed
    point-in-time is excluded from the backtest, even if it ships in the live tool.

    '
  reconstructable:
  - commit and PR history (full, from git)
  - contributor concentration at date (from git)
  - license at date (from git)
  - repo events from 2011 onward (GHArchive)
  not_reconstructable:
  - dependent counts at date
  - download trends at date
  - stars at date (GHArchive partial, expensive)
  blind_protocol: 'Score all 30 before looking at any label. Record scores in benchmarks/run-001.json.
    Only then compare. Every later tuning pass gets its own run file and a one-line note on what changed
    and why.

    '
labels:
  commercialized_success: project became a substantial standalone company
  commercialized_modest: company formed, outcome small or acqui-hire
  commercialized_failed: serious attempt, did not work
  never_commercialized: large project, no company ever formed
  adversarial: the rubric is expected to get this wrong — that's the point
